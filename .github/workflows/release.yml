name: Build and release plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Build plugin
        run: |
          curl -fsSL https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64 -o /tmp/decky-cli
          echo "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0  /tmp/decky-cli" | sha256sum --check
          chmod +x /tmp/decky-cli
          /tmp/decky-cli plugin build .
          mv "out/Decky API Caller.zip" "out/Decky-API-Caller-${GITHUB_SHA::7}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" "out/Decky-API-Caller-${GITHUB_SHA::7}.zip" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated plugin build from commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
